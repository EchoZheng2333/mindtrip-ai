<!-- ==================== JavaScript 交互逻辑 ==================== -->
<script>
    // 简单的点击交互: 切换选项卡片的选中状态
    // 获取所有 .option-card 元素 (即四个选项按钮)
    const cards = document.querySelectorAll('.option-card');

    // 为每个选项卡片绑定点击事件
    cards.forEach(card => {
        card.addEventListener('click', () => {
            // 1) 清除所有卡片的高亮状态
            cards.forEach(c => {
                // 移除高亮边框和背景
                c.classList.remove('border-primary', 'bg-surface-container-low');
                // 隐藏勾选图标
                c.querySelector('.check-icon').classList.add('opacity-0');
                c.querySelector('.check-icon').classList.remove('opacity-100');
            });
            // 2) 为被点击的卡片添加高亮状态
            card.classList.add('border-primary', 'bg-surface-container-low');
            card.querySelector('.check-icon').classList.remove('opacity-0');
            card.querySelector('.check-icon').classList.add('opacity-100');
        });
    });
</script>
