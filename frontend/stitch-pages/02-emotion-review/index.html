        /* 基础层：清除默认边距，禁止滚动回弹，防止内容溢出 */
        @layer base {
            html, body { margin: 0; padding: 0; }
            body { overscroll-behavior: none; }
            main > :first-child { margin-top: 0 !important; }
            main > :last-child { margin-bottom: 0 !important; }
        }
        /* 全局隐藏滚动条（保留滚动功能） */
        ::-webkit-scrollbar { display: none; }

        /* 描边动画：SVG 路径从不可见到完整显现 */
        @keyframes draw {
            to { stroke-dashoffset: 0; }
        }
        /* 墨迹晕染动画：从模糊透明到清晰可见，模拟水墨扩散效果 */
        @keyframes inkSpread {
            0% { filter: blur(20px); opacity: 0; transform: scale(0.95); }
            100% { filter: blur(12px); opacity: 0.6; transform: scale(1); }
        }
        /* 淡入动画：元素从透明且下移 10px 到完全可见 */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        /* 墨迹动画应用类 */
        .animate-ink {
            animation: inkSpread 2.5s cubic-bezier(0.4, 0, 0.2, 1) forwards;
        }
        /* 节点淡入应用类（初始隐藏） */
        .fade-in-node {
            opacity: 0;
            animation: fadeIn 0.8s ease-out forwards;
        }

<!-- ==================== JavaScript ==================== -->
<script>
        // 数字递增动画：从 start 到 end 持续 duration 毫秒，带 ease-out 缓动
        function animateValue(id, start, end, duration) {
            const obj = document.getElementById(id);
            let startTimestamp = null;
            const step = (timestamp) => {
                // 初始化起始时间戳
                if (!startTimestamp) startTimestamp = timestamp;
                // 计算进度百分比（0~1）
                const progress = Math.min((timestamp - startTimestamp) / duration, 1);
                // 应用 ease-out cubic 缓动函数
                const easeProgress = 1 - Math.pow(1 - progress, 3);
                obj.innerHTML = Math.floor(easeProgress * (end - start) + start);
                // 未完成则继续下一帧
                if (progress < 1) {
                    window.requestAnimationFrame(step);
                }
            };
            window.requestAnimationFrame(step);
        }

        // DOM 加载完成后执行
        document.addEventListener('DOMContentLoaded', () => {
            // 延迟 500ms 后启动精力数值动画与进度条展开动画
            setTimeout(() => {
                animateValue("energy-counter", 0, 92, 2000);
                document.getElementById('energy-bar').style.transform = 'scaleX(1)';
            }, 500);

            // 视差滚动效果：每个 section 随滚动产生微弱的垂直偏移（requestAnimationFrame 优化）
            let ticking = false;
            window.addEventListener('scroll', () => {
                if (!ticking) {
                    window.requestAnimationFrame(() => {
                        const scrolled = window.pageYOffset;
                        const sections = document.querySelectorAll('section');
                        sections.forEach((section, index) => {
                            const speed = 0.03 + (index * 0.01);
                            section.style.transform = 'translateY(' + (scrolled * speed * -0.2) + 'px)';
                        });
                        ticking = false;
                    });
                    ticking = true;
                }
            });
        });
    </script>
